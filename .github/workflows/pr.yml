name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend
      - run: test -z "$(gofmt -l $(find . -path ./frontend/node_modules -prune -o -name '*.go' -print))"
      - run: go vet $(go list ./... | grep -v '/frontend/node_modules/')
      - run: go test $(go list ./... | grep -v '/frontend/node_modules/')
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck $(go list ./... | grep -v '/frontend/node_modules/')
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: wails build -tags webkit2_41
        env:
          CGO_ENABLED: 0
